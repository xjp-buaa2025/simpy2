# ============================================================
# 航空发动机装配排产仿真系统 - 默认配置文件
# AeroEngine Assembly Scheduling Simulation System
# 北京航空航天大学 Beihang University
# ============================================================

# 排班配置
scheduling:
  work_hours_per_day: 8        # 每日工作小时数 (1-24)
  work_days_per_month: 22      # 每月工作天数 (1-31)

# 关键设备配置
# 关键设备数量有限，需要排队等待
# 普通工具（未在此列表中的）视为无限供应
critical_equipment: {}

# 休息规则配置
rest_rules:
  # 规则A: 时间触发休息
  # 当工人连续工作时间 >= 阈值时，强制休息
  time_threshold: 50           # 连续工作触发阈值（分钟）
  time_rest_duration: 5        # 时间触发休息时长（分钟）
  
  # 规则B: 负荷触发休息
  # 当任务负荷评分 > 阈值时，任务后休息
  load_threshold: 7            # 负荷触发阈值（REBA评分 1-10）
  load_rest_duration: 3        # 负荷触发休息时长（分钟）

# 仿真选项
simulation:
  pipeline_mode: true          # 流水线模式（多台并行）
  random_seed: null            # 随机种子（null表示随机）
  max_engines: 10              # 最大仿真发动机数量

# 工艺节点默认值
node_defaults:
  std_duration: 30             # 默认标准工时（分钟）
  time_variance: 5             # 默认时间方差
  work_load_score: 5           # 默认负荷评分
  rework_prob: 0.05            # 默认返工概率（仅M类型）
  required_workers: 1          # 默认所需工人数

# 操作类型定义
op_types:
  H:
    name_zh: 取/放
    name_en: Handling
    color: "#3B82F6"
    icon: "📦"
    description: 零部件的取放操作
    
  A:
    name_zh: 装配
    name_en: Assembly
    color: "#10B981"
    icon: "🔧"
    description: 装配组合操作
    
  M:
    name_zh: 测量
    name_en: Measurement
    color: "#F59E0B"
    icon: "📏"
    description: 测量检验操作，可触发返工
    can_rework: true
    
  T:
    name_zh: 工具操作
    name_en: Tooling
    color: "#8B5CF6"
    icon: "🛠️"
    description: 使用工具的操作
    
  D:
    name_zh: 数据记录
    name_en: Data Recording
    color: "#6B7280"
    icon: "📝"
    description: 记录数据的操作

# 甘特图显示配置
gantt:
  event_colors:
    NORMAL: "#3B82F6"          # 正常工作 - 蓝色
    REST: "#6B7280"            # 休息 - 灰色
    REWORK: "#EF4444"          # 返工 - 红色
    WAITING: "#F59E0B"         # 等待 - 橙色
  
  default_view_days: 3         # 默认显示天数
  hour_width_px: 60            # 每小时像素宽度

# 导出配置
export:
  csv_encoding: utf-8-sig      # CSV编码（支持Excel）
  json_ensure_ascii: false     # JSON保留中文
  date_format: "%Y-%m-%d %H:%M:%S"

# 系统信息
system:
  version: "1.0.0"
  author: "北京航空航天大学"
  project: "航空发动机装配排产仿真系统"
